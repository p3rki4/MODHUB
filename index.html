
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODHUB — Minecraft Downloads</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0e13;
      --panel: #121720;
      --panel2: #191f2a;
      --border: #252e3b;
      --text: #edf2f7;
      --muted: #929eae;
      --green: #55d68b;
      --green-dark: #1d6845;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid var(--border);
      background: #0e1219;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--green);
    }

    .logo span {
      color: white;
    }

    .header-label {
      color: var(--muted);
      font-size: 13px;
    }

    .container {
      width: min(1200px, 90%);
      margin: auto;
    }

    .hero {
      padding: 65px 0 35px;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin-bottom: 13px;
    }

    .hero h1 span {
      color: var(--green);
    }

    .hero p {
      color: var(--muted);
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 27px;
    }

    input, select {
      background: var(--panel);
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--green);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
    }

    .green-button {
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: #07130c;
      padding: 13px 20px;
      font-weight: bold;
    }

    .green-button:hover {
      background: #75eaa5;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 22px 0 28px;
    }

    .filter-button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 9px;
    }

    .filter-button.active {
      background: #163c2b;
      color: var(--green);
      border-color: var(--green-dark);
    }

    .section-title {
      font-size: 21px;
      margin-bottom: 20px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 18px;
      padding-bottom: 60px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: -28px 0 60px;
    }

    .page-button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--muted);
      font-weight: bold;
    }

    .page-button:hover:not(:disabled) {
      border-color: var(--green);
      color: var(--green);
    }

    .page-button.active {
      background: #163c2b;
      border-color: var(--green-dark);
      color: var(--green);
    }

    .page-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-info {
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .project-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: 0.2s;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--green-dark);
    }

    .card-image {
      width: 100%;
      height: 145px;
      object-fit: cover;
      background: var(--panel2);
    }

    .card-content {
      padding: 16px;
    }

    .card-title {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .card-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      min-height: 58px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .project-type {
      color: var(--green);
      background: #163c2b;
      padding: 5px 8px;
      border-radius: 6px;
    }

    .message {
      color: var(--muted);
      padding: 35px 0;
      text-align: center;
      grid-column: 1 / -1;
    }

    .hidden {
      display: none !important;
    }

    /* Страница проекта */

    .detail-page {
      padding: 35px 0 70px;
    }

    .back-button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .back-button:hover {
      color: white;
      border-color: var(--green);
    }

    .detail-heading {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 25px;
    }

    .detail-icon {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 16px;
      background: var(--panel2);
    }

    .detail-heading h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .detail-heading p {
      color: var(--muted);
      font-size: 13px;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 22px;
      margin-bottom: 18px;
      min-width: 0;
    }

    .panel h2 {
      font-size: 19px;
      margin-bottom: 17px;
    }

    .project-body {
      line-height: 1.75;
      color: #d4dce7;
      overflow-wrap: anywhere;
    }

    .project-body h1,
    .project-body h2,
    .project-body h3 {
      margin: 25px 0 12px;
      color: white;
    }

    .project-body p {
      margin-bottom: 15px;
    }

    .project-body ul,
    .project-body ol {
      margin: 12px 0 18px 25px;
    }

    .project-body a {
      color: var(--green);
    }

    .project-body img {
      max-width: 100%;
      height: auto;
      border-radius: 9px;
      margin: 12px 0;
    }

    .project-body pre {
      overflow-x: auto;
      background: #080b10;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 9px;
      margin: 15px 0;
    }

    .project-body code {
      background: #080b10;
      padding: 3px 5px;
      border-radius: 5px;
    }

    .project-body pre code {
      padding: 0;
    }

    .translation-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 12px;
    }

    .translation-button {
      background: var(--panel2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 8px;
    }

    .translation-button.active {
      color: var(--green);
      border-color: var(--green-dark);
      background: #163c2b;
    }

    .translation-status {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 15px;
      min-height: 15px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      background: var(--panel2);
    }

    .gallery img:hover {
      opacity: 0.8;
    }

    .version-select {
      width: 100%;
      margin-bottom: 12px;
    }

    .download-button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--green);
      color: #07130c;
      padding: 13px;
      border-radius: 9px;
      font-weight: bold;
      margin-top: 10px;
    }

    .download-button:hover {
      background: #75eaa5;
    }

    .info-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-line strong {
      color: white;
      text-align: right;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 25px 5%;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      cursor: pointer;
    }

    .image-modal img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
    }

    @media (max-width: 800px) {
      .detail-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      .header {
        padding: 0 5%;
      }

      .header-label {
        display: none;
      }

      .search-box {
        flex-direction: column;
      }

      .detail-heading h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">MOD<span>HUB</span></div>
  <div class="header-label">Minecraft Java Edition • Modrinth</div>
</header>

<main class="container">

  <section id="catalogPage">
    <div class="hero">
      <h1>Найди свой <span>MODHUB</span></h1>
      <p>Моды, шейдеры, ресурспаки и сборки для Minecraft Java Edition.</p>

      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="Поиск проектов..."
        >
        <button class="green-button" id="searchButton">Найти</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-button active" data-type="all">Всё</button>
      <button class="filter-button" data-type="mod">Моды</button>
      <button class="filter-button" data-type="shader">Шейдеры</button>
      <button class="filter-button" data-type="resourcepack">Ресурспаки</button>
      <button class="filter-button" data-type="modpack">Сборки</button>
    </div>

    <h2 class="section-title" id="resultsTitle">Популярные проекты</h2>
    <div class="projects" id="projects">
      <div class="message">Загружаем проекты...</div>
    </div>
    <nav class="pagination" id="pagination" aria-label="Страницы каталога"></nav>
  </section>

  <section id="detailPage" class="detail-page hidden">
    <button class="back-button" id="backButton">← Назад в каталог</button>

    <div id="detailContent"></div>
  </section>

</main>

<footer class="footer">
  MODHUB — фанатский каталог Minecraft. Данные предоставляются Modrinth.
</footer>

<div id="imageModal" class="image-modal hidden">
  <img id="modalImage" alt="Изображение проекта">
</div>

<script>
  const API = "https://api.modrinth.com/v2";

  let currentType = "all";
  let currentPage = 1;
  let totalPages = 1;
  const pageSize = 24;
  let catalogRequestId = 0;
  let currentProject = null;
  let currentVersions = [];
  let originalDescriptionHTML = "";
  let isTranslated = false;

  const projectsContainer = document.getElementById("projects");
  const searchInput = document.getElementById("searchInput");
  const catalogPage = document.getElementById("catalogPage");
  const detailPage = document.getElementById("detailPage");
  const detailContent = document.getElementById("detailContent");

  const typeNames = {
    mod: "Мод",
    shader: "Шейдер",
    resourcepack: "Ресурспак",
    modpack: "Сборка"
  };

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  function formatDownloads(number) {
    return new Intl.NumberFormat("ru-RU").format(number || 0);
  }

  function showMessage(message) {
    projectsContainer.innerHTML =
      `<div class="message">${escapeHTML(message)}</div>`;
  }

  async function loadProjects(page = 1) {
    const query = searchInput.value.trim();
    const requestId = ++catalogRequestId;

    currentPage = Math.max(1, page);
    showMessage("Ищем проекты...");
    document.getElementById("pagination").innerHTML = "";

    const params = new URLSearchParams({
      query: query,
      limit: String(pageSize),
      offset: String((currentPage - 1) * pageSize),
      index: "downloads"
    });

    if (currentType !== "all") {
      params.set(
        "facets",
        JSON.stringify([[`project_type:${currentType}`]])
      );
    }

    try {
      const response = await fetch(`${API}/search?${params}`);

      if (!response.ok) {
        throw new Error("Ошибка Modrinth API");
      }

      const data = await response.json();

      // Старый запрос не должен перезаписывать более новые результаты.
      if (requestId !== catalogRequestId) return;

      const hits = data.hits || [];
      totalPages = Math.max(1, Math.ceil((data.total_hits || 0) / pageSize));

      if (currentPage > totalPages) {
        return loadProjects(totalPages);
      }

      renderProjects(hits);
      renderPagination(data.total_hits || 0);

      document.getElementById("resultsTitle").textContent =
        query ? "Результаты поиска" : "Популярные проекты";

    } catch (error) {
      if (requestId !== catalogRequestId) return;
      showMessage("Не удалось загрузить проекты. Проверь подключение к интернету и попробуй ещё раз.");
      document.getElementById("pagination").innerHTML = "";
      console.error(error);
    }
  }

  function renderPagination(totalHits) {
    const pagination = document.getElementById("pagination");

    if (totalPages <= 1 || totalHits <= 0) {
      pagination.innerHTML = "";
      return;
    }

    const buttons = [];
    const maxVisiblePages = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
    let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

    if (endPage - startPage + 1 < maxVisiblePages) {
      startPage = Math.max(1, endPage - maxVisiblePages + 1);
    }

    buttons.push(`
      <button class="page-button" data-page="${currentPage - 1}"
        ${currentPage === 1 ? "disabled" : ""} aria-label="Предыдущая страница">
        ←
      </button>
    `);

    if (startPage > 1) {
      buttons.push(`<button class="page-button" data-page="1">1</button>`);
      if (startPage > 2) buttons.push(`<span class="page-info">…</span>`);
    }

    for (let page = startPage; page <= endPage; page++) {
      buttons.push(`
        <button class="page-button ${page === currentPage ? "active" : ""}"
          data-page="${page}" ${page === currentPage ? 'aria-current="page"' : ""}>
          ${page}
        </button>
      `);
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) buttons.push(`<span class="page-info">…</span>`);
      buttons.push(`<button class="page-button" data-page="${totalPages}">${totalPages}</button>`);
    }

    buttons.push(`
      <button class="page-button" data-page="${currentPage + 1}"
        ${currentPage === totalPages ? "disabled" : ""} aria-label="Следующая страница">
        →
      </button>
    `);

    pagination.innerHTML = `
      ${buttons.join("")}
      <div class="page-info">
        Страница ${currentPage} из ${totalPages} · Всего проектов: ${formatDownloads(totalHits)}
      </div>
    `;
  }

  function renderProjects(projects) {
    if (!projects.length) {
      showMessage("Ничего не найдено. Попробуй другой запрос.");
      return;
    }

    projectsContainer.innerHTML = projects.map(project => {
      const type = typeNames[project.project_type] || "Проект";
      const image = project.icon_url || "";

      return `
        <article class="project-card" data-id="${escapeHTML(project.project_id)}">
          <img
            class="card-image"
            src="${escapeHTML(image)}"
            alt=""
            onerror="this.style.visibility='hidden'"
          >

          <div class="card-content">
            <h3 class="card-title">${escapeHTML(project.title)}</h3>

            <p class="card-description">
              ${escapeHTML(project.description)}
            </p>

            <div class="card-meta">
              <span class="project-type">${type}</span>
              <span>⬇ ${formatDownloads(project.downloads)}</span>
            </div>
          </div>
        </article>
      `;
    }).join("");

    projectsContainer.querySelectorAll(".project-card").forEach(card => {
      card.addEventListener("click", () => {
        openProject(card.dataset.id);
      });
    });
  }

  document.getElementById("searchButton").addEventListener("click", () => loadProjects(1));

  searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") loadProjects(1);
  });

  document.querySelectorAll(".filter-button").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".filter-button").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      currentType = button.dataset.type;
      loadProjects(1);
    });
  });

  document.getElementById("pagination").addEventListener("click", event => {
    const button = event.target.closest(".page-button");
    if (!button || button.disabled) return;

    const page = Number(button.dataset.page);
    if (!Number.isInteger(page) || page < 1 || page > totalPages) return;

    loadProjects(page);
    window.scrollTo({
      top: document.getElementById("resultsTitle").offsetTop - 100,
      behavior: "smooth"
    });
  });

  async function openProject(id) {
    catalogPage.classList.add("hidden");
    detailPage.classList.remove("hidden");

    detailContent.innerHTML = `<div class="message">Загружаем страницу проекта...</div>`;

    window.scrollTo(0, 0);

    try {
      const [projectResponse, versionsResponse] = await Promise.all([
        fetch(`${API}/project/${encodeURIComponent(id)}`),
        fetch(`${API}/project/${encodeURIComponent(id)}/version`)
      ]);

      if (!projectResponse.ok || !versionsResponse.ok) {
        throw new Error("Не удалось загрузить проект");
      }

      const project = await projectResponse.json();
      const versions = await versionsResponse.json();

      currentProject = project;
      currentVersions = versions;

      renderProject(project, versions);

    } catch (error) {
      detailContent.innerHTML =
        `<div class="message">Не удалось открыть проект. Попробуй ещё раз.</div>`;

      console.error(error);
    }
  }

  function renderProject(project, versions) {
    const gallery = project.gallery || [];

    const galleryHTML = gallery.length
      ? gallery.map(image => `
          <img
            src="${escapeHTML(image.url)}"
            alt="${escapeHTML(image.title || project.title)}"
            class="gallery-image"
          >
        `).join("")
      : `<p style="color:var(--muted)">У проекта нет изображений.</p>`;

    detailContent.innerHTML = `
      <div class="detail-heading">
        <img
          class="detail-icon"
          src="${escapeHTML(project.icon_url || "")}"
          alt=""
        >

        <div>
          <h1>${escapeHTML(project.title)}</h1>
          <p>
            ${typeNames[project.project_type] || "Проект"}
            • ${formatDownloads(project.downloads)} скачиваний
          </p>
        </div>
      </div>

      <div class="detail-layout">
        <div>
          <section class="panel">
            <h2>Описание проекта</h2>

            <div class="translation-controls">
              <button
                class="translation-button active"
                id="originalButton"
              >
                Оригинал
              </button>

              <button
                class="translation-button"
                id="translateButton"
              >
                Перевести на русский
              </button>
            </div>

            <div
              class="translation-status"
              id="translationStatus"
            ></div>

            <div class="project-body" id="projectBody">
              Загружаем описание...
            </div>
          </section>

          <section class="panel">
            <h2>Галерея</h2>
            <div class="gallery">${galleryHTML}</div>
          </section>
        </div>

        <aside>
          <section class="panel">
            <h2>Скачать</h2>

            <label for="gameVersion" style="display:block;margin-bottom:8px">
              Версия Minecraft
            </label>

            <select class="version-select" id="gameVersion">
              <option value="all">Все версии</option>
            </select>

            <label for="loaderSelect" style="display:block;margin-bottom:8px">
              Загрузчик
            </label>

            <select class="version-select" id="loaderSelect">
              <option value="all">Любой загрузчик</option>
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
              <option value="neoforge">NeoForge</option>
              <option value="quilt">Quilt</option>
              <option value="iris">Iris</option>
              <option value="optifine">OptiFine</option>
              <option value="vanilla">Vanilla</option>
            </select>

            <div id="versionInfo"></div>
          </section>

          <section class="panel">
            <h2>Информация</h2>

            <div class="info-line">
              <span>Автор</span>
              <strong>${escapeHTML(project.team || "Не указан")}</strong>
            </div>

            <div class="info-line">
              <span>Лицензия</span>
              <strong>${escapeHTML(project.license?.id || "Не указана")}</strong>
            </div>

            <div class="info-line">
              <span>Скачивания</span>
              <strong>${formatDownloads(project.downloads)}</strong>
            </div>

            <a
              class="download-button"
              href="${escapeHTML(project.project_url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Страница на Modrinth
            </a>
          </section>
        </aside>
      </div>
    `;

    const projectBody = document.getElementById("projectBody");

    const markdownHTML = marked.parse(project.body || "Автор не добавил описание.");

    projectBody.innerHTML = DOMPurify.sanitize(markdownHTML);

    originalDescriptionHTML = projectBody.innerHTML;
    isTranslated = false;

    document.getElementById("translationStatus").textContent = "";

    document.getElementById("translateButton").classList.remove("active");
    document.getElementById("originalButton").classList.add("active");

    setupVersions(versions);

    document.getElementById("gameVersion").addEventListener("change", updateVersionList);
    document.getElementById("loaderSelect").addEventListener("change", updateVersionList);

    document.querySelectorAll(".gallery-image").forEach(image => {
      image.addEventListener("click", () => {
        document.getElementById("modalImage").src = image.src;
        document.getElementById("imageModal").classList.remove("hidden");
      });
    });
  }

  function setupVersions(versions) {
    const versionSelect = document.getElementById("gameVersion");

    const gameVersions = [...new Set(
      versions.flatMap(version => version.game_versions || [])
    )].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));

    versionSelect.innerHTML =
      `<option value="all">Все версии</option>` +
      gameVersions.map(version =>
        `<option value="${escapeHTML(version)}">${escapeHTML(version)}</option>`
      ).join("");

    updateVersionList();
  }

  function updateVersionList() {
    const gameVersion = document.getElementById("gameVersion").value;
    const loader = document.getElementById("loaderSelect").value;

    let filtered = currentVersions.filter(version => {
      const versionMatch =
        gameVersion === "all" ||
        (version.game_versions || []).includes(gameVersion);

      const loaderMatch =
        loader === "all" ||
        (version.loaders || []).includes(loader);

      return versionMatch && loaderMatch;
    });

    const info = document.getElementById("versionInfo");

    if (!filtered.length) {
      info.innerHTML = `<p style="color:var(--muted);font-size:13px">Подходящих версий не найдено.</p>`;
      return;
    }

    info.innerHTML = filtered.slice(0, 10).map(version => {
      const file = version.files?.find(item => item.primary) || version.files?.[0];

      if (!file) return "";

      return `
        <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
          <strong>${escapeHTML(version.name)}</strong>

          <p style="font-size:12px;color:var(--muted);margin:7px 0">
            Minecraft: ${escapeHTML((version.game_versions || []).join(", "))}
          </p>

          <p style="font-size:12px;color:var(--muted)">
            ${escapeHTML((version.loaders || []).join(", "))}
          </p>

          <a
            class="download-button"
            href="${escapeHTML(file.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Скачать ${escapeHTML(file.filename)}
          </a>
        </div>
      `;
    }).join("");
  }

  async function translateDescription() {
    const body = document.getElementById("projectBody");
    const status = document.getElementById("translationStatus");
    const translateButton = document.getElementById("translateButton");
    const originalButton = document.getElementById("originalButton");

    if (isTranslated) {
      body.innerHTML = originalDescriptionHTML;
      isTranslated = false;

      translateButton.classList.remove("active");
      originalButton.classList.add("active");
      status.textContent = "Показан оригинал.";

      return;
    }

    translateButton.disabled = true;
    originalButton.disabled = true;
    status.textContent = "Переводим описание... Это может занять немного времени.";

    try {
      const temporary = document.createElement("div");
      temporary.innerHTML = originalDescriptionHTML;

      const walker = document.createTreeWalker(
        temporary,
        NodeFilter.SHOW_TEXT
      );

      const textNodes = [];
      let node;

      while ((node = walker.nextNode())) {
        if (!node.nodeValue.trim()) continue;

        const parent = node.parentElement;

        if (parent && parent.closest("code, pre, script, style")) {
          continue;
        }

        textNodes.push(node);
      }

      let translatedCount = 0;

      for (const textNode of textNodes) {
        const originalText = textNode.nodeValue;

        const pieces = originalText.match(/\s+|[^\s]+/g) || [];
        const chunks = [];
        let currentChunk = "";

        for (const piece of pieces) {
          if (/^\s+$/.test(piece)) {
            currentChunk += piece;
            continue;
          }

          if ((currentChunk + piece).length > 350 && currentChunk.trim()) {
            chunks.push(currentChunk);
            currentChunk = "";
          }

          currentChunk += piece;
        }

        if (currentChunk) chunks.push(currentChunk);

        let translatedText = "";

        for (const chunk of chunks) {
          if (!chunk.trim()) {
            translatedText += chunk;
            continue;
          }

          const url = new URL("https://api.mymemory.translated.net/get");
          url.searchParams.set("q", chunk);
          url.searchParams.set("langpair", "en|ru");

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error("Сервис перевода временно недоступен.");
          }

          const data = await response.json();

          const translation = data.responseData?.translatedText;

          if (!translation) {
            throw new Error("Сервис не вернул перевод.");
          }

          const decoded = document.createElement("textarea");
          decoded.innerHTML = translation;

          translatedText += decoded.value;
          translatedCount++;

          status.textContent =
            `Переводим... Обработано фрагментов: ${translatedCount}`;

          // Небольшая пауза между запросами
          await new Promise(resolve => setTimeout(resolve, 120));
        }

        textNode.nodeValue = translatedText;
      }

      body.innerHTML = DOMPurify.sanitize(temporary.innerHTML);

      isTranslated = true;
      translateButton.classList.add("active");
      originalButton.classList.remove("active");

      status.textContent = "Перевод готов!";

    } catch (error) {
      status.textContent =
        "Не удалось перевести описание. Попробуй позже.";

      console.error("Ошибка перевода:", error);

    } finally {
      translateButton.disabled = false;
      originalButton.disabled = false;
    }
  }

  document.addEventListener("click", event => {
    if (event.target.closest("#translateButton")) {
      translateDescription();
    }

    if (event.target.closest("#originalButton")) {
      const body = document.getElementById("projectBody");

      if (body && isTranslated) {
        body.innerHTML = originalDescriptionHTML;
        isTranslated = false;

        document.getElementById("translateButton").classList.remove("active");
        document.getElementById("originalButton").classList.add("active");

        document.getElementById("translationStatus").textContent =
          "Показан оригинал.";
      }
    }
  });

  document.getElementById("backButton").addEventListener("click", () => {
    detailPage.classList.add("hidden");
    catalogPage.classList.remove("hidden");

    window.scrollTo(0, 0);
  });

  document.getElementById("imageModal").addEventListener("click", () => {
    document.getElementById("imageModal").classList.add("hidden");
  });

  // Старт
  loadProjects();
</script>

</body>
